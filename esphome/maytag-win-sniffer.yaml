# Seeed XIAO ESP32-C3: passive Maytag MGD7230HW3 WIN-bus listener. Added 2026-11-06.
# RX-only tap on the RIGEL comm module (J25 = ACU line, J24 = module TX). Never drives the bus:
# no TX pins are configured. Protocol decode: docs/win-bus-protocol.md
# (38400 8N1; frame = 10 02 ADDR SEQ LEN PAYLOAD CRC8, CRC-8 poly 0x31 init 0xFF over ADDR..PAYLOAD).
# v1 (raw capture + baud estimator) is kept as esphome/maytag-win-capture-v1.yaml.
#
# Wiring (XIAO pin -> dryer module):
#   D7 / GPIO20  <- J25 (ACU line)
#   D6 / GPIO21  <- J24 (module TX)
#   GND          <- J30
# Power from a USB power bank or isolated wall charger, never a PC while the dryer is live.

esphome:
  name: maytag-win-sniffer
  friendly_name: Maytag WIN Sniffer

globals:
  - id: win_buf
    type: std::vector<uint8_t>
  - id: win_crc_err
    type: uint32_t
    initial_value: "0"

esp32:
  board: seeed_xiao_esp32c3
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG
  logs:
    raw: DEBUG       # INFO hides the per-chunk hex; DEBUG while reverse-engineering writes
    sensor: WARN
    text_sensor: WARN
    binary_sensor: WARN
    select: WARN

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  - id: acu_rx
    rx_pin:
      number: GPIO20
      mode:
        input: true
        pullup: true
    baud_rate: 38400
    rx_buffer_size: 4096
    debug:
      direction: RX
      dummy_receiver: true
      after:
        bytes: 96
        timeout: 4ms
      sequence:
        - lambda: |-
            ESP_LOGD("raw", "ACU> %s", format_hex_pretty(bytes).c_str());
            auto &buf = id(win_buf);
            buf.insert(buf.end(), bytes.begin(), bytes.end());
            size_t i = 0;
            while (true) {
              size_t s = i;
              while (s + 1 < buf.size() && !(buf[s] == 0x10 && buf[s + 1] == 0x02)) s++;
              if (s + 5 > buf.size()) { i = s; break; }
              uint8_t n = buf[s + 4];
              size_t end = s + 5 + n + 1;
              if (end > buf.size()) { i = s; break; }
              uint8_t crc = 0xFF;
              for (size_t k = s + 2; k < s + 5 + n; k++) {
                crc ^= buf[k];
                for (int b = 0; b < 8; b++) crc = (crc & 0x80) ? (crc << 1) ^ 0x31 : crc << 1;
              }
              if (crc != buf[end - 1]) { id(win_crc_err)++; i = s + 2; continue; }
              uint8_t addr = buf[s + 2];
              const uint8_t *p = &buf[s + 5];
              i = end;
              // ACU (node 1) machine-status broadcast
              if (addr == 0x1F && n == 17 && p[0] == 0x0B && p[1] == 0x23) {
                uint8_t st = p[7];
                const char *name = st == 0x01 ? "Idle" : st == 0x02 ? "Running" : st == 0x04 ? "Complete"
                                 : st == 0x05 ? "Paused" : nullptr;
                std::string s_name = name ? name : str_sprintf("Unknown 0x%02X", st);
                if (id(machine_state).state != s_name) id(machine_state).publish_state(s_name);
                bool door_open = p[8] == 0x00;
                if (!id(door).has_state() || id(door).state != door_open) id(door).publish_state(door_open);
                uint16_t rem = (p[9] << 8) | p[10];
                float mins = rem == 0xFFFF ? NAN : (rem + 59) / 60;
                if (id(time_remaining).state != mins && !(std::isnan(mins) && std::isnan(id(time_remaining).state)))
                  id(time_remaining).publish_state(mins);
                bool cool = st == 0x02 && p[13] == 0x02;
                if (!id(cooling).has_state() || id(cooling).state != cool) id(cooling).publish_state(cool);
              }
              // Cycle settings (ACU -> module notify, or ACU broadcast)
              if ((addr == 0x61 || addr == 0x1F) && n == 13 && p[0] == 0x0B && (p[1] == 0x05 || p[1] == 0x24)) {
                // Cycle ids mapped 2026-11-06 by turning the knob; 0x08 not seen ("Custom" reuses the stored cycle's id).
                static const char *cycles[] = {nullptr, nullptr, "Normal", "Heavy Duty", "Whites", "Sanitize", "Towels",
                                               "Bulky", nullptr, "Timed Dry", "Regular", "Steam Refresh",
                                               "Wrinkle Control", "Delicates", "Quick Dry"};
                std::string cyc = (p[3] < 15 && cycles[p[3]]) ? cycles[p[3]] : str_sprintf("Cycle 0x%02X", p[3]);
                if (id(cycle).state != cyc) id(cycle).publish_state(cyc);
                static const char *temps[] = {"?", "Air Only", "Low", "Medium Low", "Medium", "Medium High", "High"};
                std::string t = p[5] <= 6 ? temps[p[5]] : str_sprintf("0x%02X", p[5]);
                if (id(temperature).state != t) id(temperature).publish_state(t);
                std::string w = p[8] == 1 ? "Off" : p[8] == 2 ? "On" : p[8] == 3 ? "On + Steam" : str_sprintf("0x%02X", p[8]);
                if (id(wrinkle).state != w) id(wrinkle).publish_state(w);
                static const char *dry[] = {"?", "Less Dry", "Normal", "More Dry", "Very Dry"};
                std::string dl = p[6] <= 4 ? dry[p[6]] : str_sprintf("0x%02X", p[6]);
                if (id(dryness).state != dl) id(dryness).publish_state(dl);
                std::string raw = format_hex_pretty(p, n);
                if (id(settings_raw).state != raw) id(settings_raw).publish_state(raw);
              }
            }
            buf.erase(buf.begin(), buf.begin() + i);
            if (buf.size() > 512) buf.clear();
  - id: mod_rx
    rx_pin:
      number: GPIO21
      mode:
        input: true
        pullup: true
    baud_rate: 38400
    rx_buffer_size: 4096
    debug:
      direction: RX
      dummy_receiver: true
      after:
        bytes: 96
        timeout: 4ms
      sequence:
        - lambda: ESP_LOGD("raw", "MOD> %s", format_hex_pretty(bytes).c_str());

text_sensor:
  - platform: template
    id: machine_state
    name: "Dryer state"
    icon: mdi:tumble-dryer
  - platform: template
    id: cycle
    name: "Dryer cycle"
    icon: mdi:format-list-bulleted
  - platform: template
    id: temperature
    name: "Dryer temperature setting"
    icon: mdi:thermometer
  - platform: template
    id: wrinkle
    name: "Dryer wrinkle prevent"
    icon: mdi:iron-outline
  - platform: template
    id: dryness
    name: "Dryer dryness level"
    icon: mdi:water-percent
  - platform: template
    id: settings_raw
    name: "Dryer settings raw"
    entity_category: diagnostic
    icon: mdi:code-brackets

binary_sensor:
  - platform: template
    id: door
    name: "Dryer door"
    device_class: door
  - platform: template
    id: cooling
    name: "Dryer cooldown"
    icon: mdi:snowflake
  - platform: status
    name: "Status"

sensor:
  - platform: template
    id: time_remaining
    name: "Dryer time remaining"
    unit_of_measurement: "min"
    device_class: duration
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "Bus CRC errors"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return id(win_crc_err);
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic
